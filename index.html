<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسمها</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<style>
  :root { --bg:#f2f4f5; --surface:#fff; --line:#dde2e5; --ink:#26303a; --muted:#6b7782; --accent:#4f7a78; --accent-hover:#436866; --on-accent:#fff; }
  .dark { --bg:#13171a; --surface:#1b2024; --line:#2a3138; --ink:#e4e8eb; --muted:#8c97a1; --accent:#7fa9a6; --accent-hover:#93b9b6; --on-accent:#0f1416; }
  body { font-family:'Readex Pro',system-ui,sans-serif; background:var(--bg); color:var(--ink); transition:background-color .3s,color .3s; }
  .surface { background:var(--surface); border:1px solid var(--line); border-radius:1.25rem; }
  .muted { color:var(--muted); }
  .btn { background:var(--accent); color:var(--on-accent); border-radius:.875rem; font-weight:600; transition:background-color .2s; }
  .btn:hover:not(:disabled) { background:var(--accent-hover); }
  .btn:disabled { opacity:.5; }
  .btn-quiet { color:var(--muted); border-radius:.875rem; transition:color .2s; }
  .btn-quiet:hover:not(:disabled) { color:var(--ink); }
  .tab { padding:.6rem 0; color:var(--muted); border-bottom:2px solid transparent; transition:color .2s,border-color .2s; }
  .tab[aria-selected="true"] { color:var(--ink); border-color:var(--accent); }
  textarea { background:var(--bg); border:1px solid var(--line); border-radius:.875rem; color:var(--ink); }
  textarea::placeholder { color:var(--muted); opacity:.7; }
  textarea:focus { outline:none; border-color:var(--accent); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .rrow { border-bottom:1px solid var(--line); transition:color .4s, font-weight .4s; color:var(--muted); }
  .rrow:last-child { border-bottom:0; }
  .rrow.done { color:var(--ink); }
  .rnum { opacity:0; }
  #stage-box { height:11rem; position:relative; overflow:hidden; }
  .roll { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:0 1rem; text-align:center; font-size:clamp(1.75rem,7vw,2.75rem); line-height:1.3; overflow-wrap:anywhere; }
  .bar { height:3px; width:5rem; background:var(--accent); border-radius:2px; transform-origin:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body class="min-h-screen">
<main class="max-w-lg mx-auto px-5 py-10">
  <header class="flex items-center justify-between mb-8">
    <h1 class="text-2xl font-semibold">النرد</h1>
    <button id="themeBtn" class="btn-quiet text-sm px-3 py-2"></button>
  </header>

  <!-- Input view -->
  <section id="viewInput">
    <div class="flex gap-6 mb-4 border-b" style="border-color:var(--line)" role="tablist">
      <button id="tabPick" class="tab" role="tab">خيار عشوائي</button>
      <button id="tabShuffle" class="tab" role="tab">ترتيب عشوائي</button>
    </div>

    <div class="surface p-5">
      <label for="items" class="block text-sm muted mb-2">اكتب كل خيار في سطر</label>
      <textarea id="items" rows="6" class="w-full p-4 text-base resize-none" placeholder="بيتزا&#10;برغر&#10;سوشي"></textarea>
      <div class="flex items-center justify-between mt-2 text-sm muted">
        <span id="count"></span>
        <button id="clearBtn" class="btn-quiet px-2 py-1">مسح</button>
      </div>
      <button id="go" class="btn w-full py-3.5 mt-4"></button>
      <p id="msg" class="text-center text-sm mt-3 min-h-[1.25rem]" style="color:#b4534a"></p>
    </div>
  </section>

  <!-- Pick view: its own space -->
  <section id="viewStage" hidden>
    <button id="backBtn" class="btn-quiet text-sm px-2 py-1 mb-6">رجوع للخيارات</button>
    <div class="surface px-5 py-10 text-center">
      <div id="stage-box" aria-live="polite"></div>
      <div class="flex justify-center h-[3px] mt-2"><div id="bar" class="bar" style="transform:scaleX(0)"></div></div>
      <p id="status" class="muted text-sm mt-4 min-h-[1.25rem]"></p>
      <div class="mt-8 flex flex-col gap-2">
        <button id="again" class="btn w-full py-3.5">اختر مرة ثانية</button>
        <button id="edit" class="btn-quiet w-full py-2.5 text-sm">تعديل الخيارات</button>
      </div>
    </div>
  </section>

  <!-- Shuffle view: its own space -->
  <section id="viewRank" hidden>
    <button id="rankBack" class="btn-quiet text-sm px-2 py-1 mb-6">رجوع للخيارات</button>
    <div class="surface px-5 py-3">
      <div id="rankList" aria-live="polite"></div>
    </div>
    <p id="rankStatus" class="muted text-sm text-center mt-4 min-h-[1.25rem]"></p>
    <div class="mt-6 flex flex-col gap-2">
      <button id="rankAgain" class="btn w-full py-3.5">رتّب مرة ثانية</button>
      <button id="rankEdit" class="btn-quiet w-full py-2.5 text-sm">تعديل الخيارات</button>
    </div>
  </section>
  <footer class="site-credit">
  Made by <span>younes</span>
</footer>

<style>
  .site-credit {
    margin-top: 2rem;
    padding: 1rem 0;
    text-align: center;
    color: var(--muted);
    font-family: 'Readex Pro', system-ui, sans-serif;
    font-size: .7rem;
    border-top: 1px solid var(--line);
    opacity: .75;
  }

  .site-credit span {
    color: var(--accent);
    font-weight: 500;
  }
</style>
</main>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function randInt(n) { const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let mode = store.get('mode', 'pick') === 'shuffle' ? 'shuffle' : 'pick';
let busy = false;

/* Theme */
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  $('themeBtn').textContent = dark ? 'الوضع الفاتح' : 'الوضع الداكن';
  store.set('theme', dark ? 'dark' : 'light');
}
applyTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') === 'dark');
$('themeBtn').onclick = () => applyTheme(!document.documentElement.classList.contains('dark'));

/* Items */
const getItems = () => $('items').value.split('\n').map(s => s.trim()).filter(Boolean);
function updateCount() {
  const n = getItems().length;
  $('count').textContent = n === 0 ? 'لا خيارات بعد' : n === 1 ? 'خيار واحد' : n === 2 ? 'خياران' : n + (n <= 10 ? ' خيارات' : ' خيارًا');
}
$('items').value = store.get('items', '');
$('items').addEventListener('input', () => { store.set('items', $('items').value); updateCount(); $('msg').textContent = ''; });
$('clearBtn').onclick = () => { $('items').value = ''; store.set('items', ''); updateCount(); };
updateCount();

/* Tabs */
function setMode(m) {
  if (busy) return;
  mode = m; store.set('mode', m);
  $('tabPick').setAttribute('aria-selected', m === 'pick');
  $('tabShuffle').setAttribute('aria-selected', m === 'shuffle');
  $('go').textContent = m === 'pick' ? 'اختر لي' : 'رتّبها';
  $('msg').textContent = '';
}
$('tabPick').onclick = () => setMode('pick');
$('tabShuffle').onclick = () => setMode('shuffle');
setMode(mode);

/* Shuffle & rank (dedicated view) */
const rankLock = on => { $('rankAgain').disabled = on; $('rankEdit').disabled = on; $('rankBack').disabled = on; };

async function runRank() {
  const items = getItems();
  if (items.length < 2) { backToInput(); $('msg').textContent = 'أضف خيارين على الأقل، كل خيار في سطر.'; return; }
  busy = true; rankLock(true);
  const list = $('rankList');
  list.innerHTML = '';
  $('rankStatus').textContent = 'جارٍ الترتيب…';

  const rows = items.map(t => {
    const r = document.createElement('div');
    r.className = 'rrow flex items-center gap-4 py-3.5';
    r.innerHTML = '<span class="rnum w-6 text-center tabular-nums"></span><span class="min-w-0 break-words">' + esc(t) + '</span>';
    list.appendChild(r);
    return r;
  });

  const rounds = reduced ? 0 : Math.min(4, 2 + Math.ceil(items.length / 6));
  const dur = 420, ease = 'cubic-bezier(.3,.7,.2,1)';
  const stagger = Math.min(40, 320 / rows.length);
  let order = rows.slice();

  // Reorder the DOM, then animate each row from its old position (FLIP)
  async function reorder(next) {
    const first = new Map(rows.map(r => [r, r.getBoundingClientRect().top]));
    next.forEach(r => list.appendChild(r));
    rows.forEach(r => {
      const dy = first.get(r) - r.getBoundingClientRect().top;
      if (!dy) return;
      r.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }],
        { duration: dur, delay: randInt(Math.round(stagger * rows.length) + 1), easing: ease, fill: 'backwards' });
    });
    order = next;
    await sleep(dur + stagger * rows.length + 40);
  }

  const differs = (a, b) => a.some((r, i) => r !== b[i]);
  for (let i = 0; i <= rounds; i++) {
    const last = i === rounds;
    let next, tries = 0;
    do { next = shuffle(rows); tries++; } while (!differs(next, order) && tries < 8);
    if (reduced && !last) continue;
    await reorder(next);
    if (!last) await sleep(90);
  }

  // Settle: rows turn to full ink, numbers appear one after another
  order.forEach((r, i) => {
    r.classList.add('done');
    const n = r.querySelector('.rnum');
    n.textContent = i + 1;
    n.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }],
      { duration: reduced ? 0 : 320, delay: reduced ? 0 : i * 70, easing: ease, fill: 'forwards' });
  });
  await sleep(reduced ? 0 : 320 + order.length * 70);
  $('rankStatus').textContent = 'تم الترتيب';
  busy = false; rankLock(false);
}

function showRank() { $('viewInput').hidden = true; $('viewRank').hidden = false; window.scrollTo(0, 0); runRank(); }

/* Pick one (dedicated view) */
let current = null;
function showName(text, dur, final) {
  const box = $('stage-box');
  const el = document.createElement('div');
  el.className = 'roll';
  el.textContent = text;
  el.style.color = final ? 'var(--ink)' : 'var(--muted)';
  el.style.fontWeight = final ? '600' : '400';
  box.appendChild(el);
  const t = Math.max(60, Math.min(dur * 0.85, final ? 450 : 260));
  const easing = 'cubic-bezier(.2,.7,.2,1)';
  el.animate([{ transform: 'translateY(70%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: t, easing, fill: 'both' });
  if (current) {
    const old = current;
    old.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(-70%)', opacity: 0 }], { duration: t, easing, fill: 'forwards' }).onfinish = () => old.remove();
  }
  current = el;
}

async function runPick() {
  const items = getItems();
  if (items.length < 2) { backToInput(); $('msg').textContent = 'أضف خيارين على الأقل، كل خيار في سطر.'; return; }
  busy = true; $('again').disabled = true; $('edit').disabled = true; $('backBtn').disabled = true;
  $('bar').style.transform = 'scaleX(0)'; $('bar').style.transition = 'none';
  $('stage-box').innerHTML = ''; current = null;
  $('status').textContent = 'جارٍ الاختيار…';

  const win = randInt(items.length);
  const total = reduced ? 1 : Math.min(26, Math.max(16, items.length * 2 + 8));
  const seq = [];
  for (let i = 0; i < total - 1; i++) {
    let k; do { k = randInt(items.length); } while (k === seq[i - 1]);
    seq.push(k);
  }
  if (seq[seq.length - 1] === win) seq[seq.length - 1] = (win + 1) % items.length;
  seq.push(win);

  for (let i = 0; i < seq.length; i++) {
    const last = i === seq.length - 1;
    const dur = 90 + 480 * Math.pow(i / Math.max(1, seq.length - 1), 2.2);
    showName(items[seq[i]], dur, last);
    await sleep(last ? 500 : dur);
  }
  $('bar').style.transition = 'transform .5s ease'; $('bar').style.transform = 'scaleX(1)';
  $('status').textContent = 'تم الاختيار';
  busy = false; $('again').disabled = false; $('edit').disabled = false; $('backBtn').disabled = false;
}

function showStage() { $('viewInput').hidden = true; $('viewStage').hidden = false; window.scrollTo(0, 0); runPick(); }
function backToInput() { if (busy) return; $('viewStage').hidden = true; $('viewRank').hidden = true; $('viewInput').hidden = false; }
$('again').onclick = () => { if (!busy) runPick(); };
$('edit').onclick = backToInput;
$('backBtn').onclick = backToInput;
$('rankBack').onclick = backToInput;
$('rankEdit').onclick = backToInput;
$('rankAgain').onclick = () => { if (!busy) runRank(); };

/* Run */
$('go').onclick = () => {
  const items = getItems();
  if (items.length < 2) { $('msg').textContent = 'أضف خيارين على الأقل، كل خيار في سطر.'; return; }
  mode === 'pick' ? showStage() : showRank();
};
</script>
</body>
</html>
